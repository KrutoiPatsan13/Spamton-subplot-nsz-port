name: Build Switch NRO

on:
  workflow_dispatch:
  push:
    branches: [main, switch-port]

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends git ninja-build

      - name: Build SpamtonSubplot.nro
        env:
          DEVKITPRO: /opt/devkitpro
        run: bash switch/build.sh

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: SpamtonSubplot-switch
          path: dist/SpamtonSubplot.nro

      - name: Lay out the SD card with the Russian translation
        run: |
          mkdir -p sd-ru/switch/spamton_subplot
          cp dist/SpamtonSubplot.nro sd-ru/switch/spamton_subplot/
          cp -r russian/lang sd-ru/switch/spamton_subplot/

      - name: Upload SD card layout (Russian)
        uses: actions/upload-artifact@v4
        with:
          name: SpamtonSubplot-SD-card-RU
          path: sd-ru/
